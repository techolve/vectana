# Local development / evaluation.
#   docker compose --profile dev up --build
# Mailpit UI: http://localhost:8025
name: vectana

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: techolve/vectana:dev
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://vectana:vectana@db:5432/vectana
    SECRET_KEY: ${SECRET_KEY:-dev-only-secret-key-change-me-0123456789}
    WEB_URL: ${WEB_URL:-http://localhost:8000}
    MAIL_BACKEND: ${MAIL_BACKEND:-smtp}
    SMTP_HOST: ${SMTP_HOST:-mailpit}
    SMTP_PORT: ${SMTP_PORT:-1025}
    SMTP_START_TLS: ${SMTP_START_TLS:-false}
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: vectana
      POSTGRES_PASSWORD: vectana
      POSTGRES_DB: vectana
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vectana"]
      interval: 3s
      retries: 20

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  app:
    <<: *app
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["dev"]
    ports:
      - "8025:8025"

volumes:
  db-data:
