# Builds the image and pushes it to Docker Hub when a tag vX.Y.Z is pushed.
# Needs repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker
# Hub access token with Read & Write on the image repository).
name: Publish Docker image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: heki0824/vectana

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the app version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' api/pyproject.toml)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match api/pyproject.toml version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
