[tools]
python = "3.14"
uv = "latest"

[tasks.dev]
run = "uv run uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"

[tasks.worker]
run = "uv run python -m app.worker"

[tasks.test]
run = "uv run pytest"

[tasks.lint]
run = "uv run ruff check . && uv run ruff format --check ."

[tasks.typecheck]
run = "uv run mypy app"

[tasks.check]
depends = ["lint", "typecheck", "test"]

[tasks.migrate]
run = "uv run alembic upgrade head"

[tasks.makemigration]
run = "uv run alembic revision --autogenerate -m"
