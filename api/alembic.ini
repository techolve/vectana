# Alembic configuration. The database URL is supplied at runtime from
# app.core.config (or the ALEMBIC_DATABASE_URL override) in alembic/env.py,
# so it is intentionally not set here.
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# Use a timestamp + slug for readable, ordered revision filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
