[project]
name = "vectana"
version = "1.0.0"
description = "Vectana - project dependency vulnerability monitoring"
license = "AGPL-3.0-only"
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.2",
    "alembic>=1.18.4",
    "apscheduler>=3.10.4,<4",
    "asyncpg>=0.30.0",
    "bcrypt>=4.3.0",
    "cvss>=3.2",
    "email-validator>=2.2.0",
    "fastapi[standard]>=0.136.3",
    "httpx>=0.27.0",
    "packaging>=24.0",
    "pydantic-settings>=2.6.0",
    "PyJWT>=2.9.0",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.50",
    "sqlmodel>=0.0.38",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "mypy>=1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["alembic/"]
